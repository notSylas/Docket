[package]
name = "docketd"
version.workspace = true
edition = "2021"
license.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
docket-proto = { version = "0.1.0", path = "../docket-proto" }
futures-util = "0.3.34"
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "io-util", "net", "sync", "time", "signal"] }
tokio-stream = "0.1.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
