# Alembic configuration for the Attest "Evidence Core" schema.

[alembic]
# path to migration scripts, relative to this file.
script_location = src/attest/db/migrations

# template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
prepend_sys_path = .

path_separator = os

# database URL. Left blank here on purpose: env.py resolves it from
# attest.config.settings.sqlite_path unless this value is set explicitly
# (e.g. by tests, which configure a Config object programmatically before
# running migrations against a tmp_path sqlite file).
sqlalchemy.url =


[post_write_hooks]


# Logging configuration.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
