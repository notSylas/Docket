[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docket"
version = "0.1.0"
description = "Local-first, evidence-backed work intelligence assistant"
requires-python = ">=3.12"
dependencies = [
    "docling",
    "lancedb",
    "ollama",
    "pyarrow",
    "langgraph",
    "langchain-ollama",
    "sqlalchemy>=2.0",
    "alembic",
    "pydantic>=2.0",
    "pydantic-settings",
    "typer",
    "watchfiles",
    "prompt_toolkit>=3.0.43",
    "rich>=13",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
]

[project.scripts]
docket = "docket.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/docket"]

[tool.pytest.ini_options]
markers = [
    "integration: requires a running Ollama instance with qwen3:14b and qwen3-embedding:0.6b pulled",
]
testpaths = ["tests"]
