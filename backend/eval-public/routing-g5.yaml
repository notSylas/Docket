# G5 routing set (Upgrade/08 section 5.2; Upgrade/06 sections 4.2 and 10.3).
#
# Each item labels the correct execution path for the Auto router:
#   FAST           one hybrid retrieval and one generation is enough (single lookup, a literal TOTAL/subtotal row,
#                  a resolvable follow-up, or a question the corpus cannot answer, where the right behaviour is a
#                  fast abstention)
#   INVESTIGATION  needs more than one retrieval or computation: comparison, timeline, exhaustive listing,
#                  cross-document or cross-sheet derivation, conflict/agreement checks, causal or impact questions
#   CLARIFY        the question cannot be answered correctly until the user picks a period, file or referent
# `corpus` names the folder under eval-public/ the question was written against (the labelled path assumes that
# corpus is indexed). `history` is the prior conversation, if any. `reason_codes` are labels, not a closed enum;
# the vocabulary is documented in eval-public/experiments/g5_route_accuracy.py.
# Standalone file: the gold Question schema forbids extra fields, so routing labels live here. Hand-labelled.
